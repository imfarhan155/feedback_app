name: feedback_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  printing: ^5.11.0
  pdf: ^3.10.8
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/review.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/review.png"
  min_sdk_android: 21